<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Coney Island Boardwalk Photo Repository</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @font-face {
      font-family: "Sohne";
      src: url("fonts/Sohne-Buch.otf") format("opentype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Sohne";
      src: url("fonts/Sohne-Halbfett.otf") format("opentype");
      font-weight: 700;
    }

    :root {
      --brand-color: rgb(0, 85, 100);
      --footer-bg: #005463;
      --footer-green: #00ffb5;
      --footer-height: 90px;
    }

    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Sohne', -apple-system, BlinkMacSystemFont, sans-serif; }
    #map { position: absolute; top: var(--footer-height); left: 0; right: 0; bottom: 0; width: 100%; background: #f2f2f2; }

    /* Header bar, dark blue, spans top of screen */
    #map-footer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--footer-height);
      background: var(--footer-bg);
      border-bottom: 0.5pt solid var(--footer-green);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-sizing: border-box;
    }

    #map-title {
      color: var(--footer-green);
      font-family: "Sohne", sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0.5px;
      line-height: 1.1;
      white-space: nowrap;
    }

    #ost-logo-link {
      display: block;
      height: 32px;
    }
    #ost-logo-link img {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Instruction box, upper-left of the map */
    #instructions-box {
      position: absolute;
      top: calc(var(--footer-height) + 16px);
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.75);
      border: 0.5pt solid var(--footer-bg);
      color: var(--footer-bg);
      font-family: "Sohne", sans-serif;
      font-weight: 400;
      font-size: 17px;
      line-height: 1.4;
      padding: 16px 20px;
      max-width: 340px;
      border-radius: 0;
    }

    #parcel-controls-box {
      position: absolute;
      top: calc(var(--footer-height) + 16px + 130px);
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.75);
      border: 0.5pt solid var(--footer-bg);
      color: var(--footer-bg);
      font-family: "Sohne", sans-serif;
      font-weight: 400;
      font-size: 17px;
      line-height: 1.4;
      padding: 16px 20px;
      max-width: 340px;
      border-radius: 0;
    }
    #parcel-controls-box label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      cursor: pointer;
    }
    #parcel-controls-box input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--footer-bg);
      cursor: pointer;
    }

    /* Speech-bubble popups: square corners, image fits flush, 2x size */
    .leaflet-popup-content-wrapper {
      background: #fff;
      border: 2px solid var(--brand-color);
      border-radius: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      padding: 0;
      overflow: hidden;
    }
    .parcel-popup-container .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.75);
    }
    /* Flip popup to render below the marker */
    .leaflet-popup-tip-container {
      display: none !important;
    }
    .leaflet-popup-content-wrapper {
      position: relative;
    }
    .leaflet-popup-content-wrapper::before {
      content: '';
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-bottom: 16px solid var(--brand-color);
    }
    .leaflet-popup-content-wrapper::after {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 12px solid #fff;
    }
    .leaflet-popup-content {
      margin: 0;
      width: auto !important;
      font-size: 18px;
      font-family: 'Sohne', sans-serif;
      color: #222;
    }
    .popup-photo {
      display: block;
      max-width: 35vw;
      max-height: 31vh;
      width: auto;
      height: auto;
      margin: 0 auto;
    }
    .popup-text {
      padding: 13px 18px 18px;
    }
    .popup-title {
      color: var(--brand-color);
      font-weight: 700;
      font-size: 22px;
    }

    /* Parcel popups: landscape rectangle, formatted status + labels */
    .parcel-popup {
      max-width: 620px;
      width: max-content;
      box-sizing: border-box;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 15px;
      line-height: 1.2;
      color: var(--brand-color);
    }
    .parcel-line {
      white-space: nowrap;
    }
    .parcel-status {
      color: var(--brand-color);
      text-transform: uppercase;
      font-weight: 700;
      font-size: 17px;
      margin: 0 0 2px 0;
    }
    .parcel-label {
      font-weight: 700;
    }
    .leaflet-popup-close-button {
      color: var(--brand-color) !important;
      text-shadow: none !important;
      z-index: 10;
    }

    /* Bottom-left control stacking layout */
    .leaflet-bottom.leaflet-left {
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }

    /* Custom zoom control — fully owned, no Leaflet default styles to fight */
    #custom-zoom {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
    }
    #custom-zoom button {
      width: 34px;
      height: 34px;
      border: none;
      background: #fff;
      color: var(--brand-color);
      font-size: 20px;
      font-family: 'Sohne', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }
    #custom-zoom button:first-child {
      border-bottom: 1px solid #eee;
    }
    #custom-zoom button:hover {
      background: #f4f4f4;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="instructions-box">Click a point to view a photo of that location on the Boardwalk. Click the photo to open the image in a new browser tab.</div>
  <div id="parcel-controls-box">
    Click on the parcels to see ownership. Toggle the public parcels versus private parcels by clicking the check boxes below.
    <label><input type="checkbox" id="toggle-public" checked> Public Parcels On / Off</label>
    <label><input type="checkbox" id="toggle-private" checked> Private Parcels On / Off</label>
  </div>
  <div id="map-footer">
    <div id="map-title">Coney Island Boardwalk Photo Repository</div>
    <a id="ost-logo-link" href="https://orchardstreet.nyc" target="_blank" rel="noopener">
      <img src="ost.svg" alt="Orchard Street NYC">
    </a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      zoomControl: false
    }).setView([40.5745, -73.965], 12);

    // Custom zoom control, bottom left — no Leaflet default classes involved
    const CustomZoom = L.Control.extend({
      options: { position: 'bottomleft' },
      onAdd: function (map) {
        const container = L.DomUtil.create('div', '');
        container.id = 'custom-zoom';

        const zoomInBtn = L.DomUtil.create('button', '', container);
        zoomInBtn.innerHTML = '+';
        zoomInBtn.type = 'button';

        const zoomOutBtn = L.DomUtil.create('button', '', container);
        zoomOutBtn.innerHTML = '&minus;';
        zoomOutBtn.type = 'button';

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.on(zoomInBtn, 'click', () => map.zoomIn());
        L.DomEvent.on(zoomOutBtn, 'click', () => map.zoomOut());

        return container;
      }
    });
    map.addControl(new CustomZoom());

    // Flip popups to open below the marker instead of above.
    // With Leaflet's own tip hidden, the container's height is just the
    // photo box; shifting it down by that height puts the box's top edge
    // (where our custom arrow is attached) right at the marker.
    map.on('popupopen', function (e) {
      const container = e.popup._container;
      if (container) {
        const height = container.offsetHeight;
        container.style.marginTop = height + 'px';
      }
    });

    // Base layers: clean grayscale street map + aerial/satellite
    const streetLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 19,
      subdomains: 'abcd'
    });

    const aerialLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics',
      maxZoom: 19
    });

    aerialLayer.addTo(map);

    // Layer switcher, bottom left, above zoom control
    L.control.layers(
      { "Street Map": streetLayer, "Aerial": aerialLayer },
      null,
      { position: 'bottomleft', collapsed: true }
    ).addTo(map);

    // Parcels layer (split into public/private so they can be toggled independently)
    let publicParcelsLayer, privateParcelsLayer, photoPointsLayer;

    function parcelStyle(feature) {
      const isPublic = feature.properties.PubPvt === 'Public';
      return {
        color: '#ffffff',
        weight: 0.75,
        fillColor: isPublic ? '#7a2657' : '#de93c4',
        fillOpacity: 0.45
      };
    }

    function parcelOnEachFeature(feature, layer) {
      const p = feature.properties;
      const popupContent = `
        <div class="parcel-popup">
          <div class="parcel-status">${p.PubPvt.toUpperCase()}</div>
          <div class="parcel-line"><span class="parcel-label">Owner:</span> ${p.OwnerName}</div>
          <div class="parcel-line"><span class="parcel-label">Address:</span> ${p.Address}</div>
        </div>
      `;
      layer.bindPopup(popupContent, { maxWidth: 620, minWidth: 200, autoPan: false, className: 'parcel-popup-container' });
    }

    function reorderLayers() {
      if (photoPointsLayer) {
        photoPointsLayer.bringToFront();
      }
    }

    fetch('parcels.geojson')
      .then(res => res.json())
      .then(data => {
        publicParcelsLayer = L.geoJSON(data, {
          filter: f => f.properties.PubPvt === 'Public',
          style: parcelStyle,
          onEachFeature: parcelOnEachFeature
        }).addTo(map);

        privateParcelsLayer = L.geoJSON(data, {
          filter: f => f.properties.PubPvt === 'Private',
          style: parcelStyle,
          onEachFeature: parcelOnEachFeature
        }).addTo(map);

        reorderLayers();

        document.getElementById('toggle-public').addEventListener('change', function (e) {
          if (e.target.checked) {
            map.addLayer(publicParcelsLayer);
          } else {
            map.removeLayer(publicParcelsLayer);
          }
          reorderLayers();
        });

        document.getElementById('toggle-private').addEventListener('change', function (e) {
          if (e.target.checked) {
            map.addLayer(privateParcelsLayer);
          } else {
            map.removeLayer(privateParcelsLayer);
          }
          reorderLayers();
        });
      })
      .catch(err => console.error('Error loading parcels.geojson:', err));

    fetch('points.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 6,
              fillColor: 'rgb(0, 85, 100)',
              color: '#fff',
              weight: 1.5,
              fillOpacity: 0.9
            });
          },
          onEachFeature: function (feature, layer) {
            const props = feature.properties;
            const photoPath = props.photo;
            const popupContent = `
              <img class="popup-photo" src="${photoPath}" alt="${props.filename}" onclick="window.open('${photoPath}', '_blank')" style="cursor: pointer;" />
              <div class="popup-text">
                <div class="popup-title">${props.filename}</div>
                <div>${props.timestamp || ''}</div>
              </div>
            `;
            layer.bindPopup(popupContent, { maxWidth: 1600, minWidth: 300, autoPan: false });
          }
        }).addTo(map);

        photoPointsLayer = layer;
        reorderLayers();

        map.fitBounds(layer.getBounds(), { padding: [60, 60], animate: false });

        // Position the dot cluster so it sits 1/3 of the way up from the
        // bottom of the screen, computed in actual pixels so it holds
        // regardless of window size or zoom level.
        const mapSize = map.getSize();
        const targetY = mapSize.y * 0.6; // slightly higher than before
        const offsetY = (mapSize.y / 2) - targetY;
        map.panBy([0, offsetY], { animate: false });
      })
      .catch(err => console.error('Error loading points.geojson:', err));
  </script>
</body>
</html>
