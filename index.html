<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Coney Island Photo Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .popup-photo { max-width: 250px; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([40.5749, -73.9805], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    fetch('points.geojson')
      .then(res => res.json())
      .then(data => {
        const layer = L.geoJSON(data, {
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 6,
              fillColor: '#ff6600',
              color: '#333',
              weight: 1,
              fillOpacity: 0.8
            });
          },
          onEachFeature: function (feature, layer) {
            const props = feature.properties;
            const photoPath = props.photo;
            const popupContent = `
              <img class="popup-photo" src="${photoPath}" alt="${props.filename}" />
              <strong>${props.filename}</strong><br>
              ${props.timestamp || ''}
            `;
            layer.bindPopup(popupContent, { maxWidth: 300 });
          }
        }).addTo(map);

        map.fitBounds(layer.getBounds(), { padding: [20, 20] });
      })
      .catch(err => console.error('Error loading points.geojson:', err));
  </script>
</body>
</html>
